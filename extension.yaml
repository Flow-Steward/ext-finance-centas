manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.centas
kind: tool_provider
version: 0.1.1
release_stage: active
billing_mode: free
display_name: Centas
description: "Connect workflows to Centas, the Lithuanian accounting and business\
  \ program, through its web exchange Centas WS (ws.centas.lt), covering its whole\
  \ documented API. Steps send sales invoices, customer orders, purchase invoices\
  \ and invoices to other companies with their lines, and payments, products, clients\
  \ and suppliers and consignment notes in batches; they also update, record payments\
  \ against or delete sales documents. Totals are checked against the lines before\
  \ anything is sent.\n\nRead steps return products, prices and stock, product cards\
  \ and gallery links, clients and suppliers, sales documents by number, date or unpaid\
  \ status, purchases of a date range, an order\u2019s invoice PDF and counts of new\
  \ records. When a workflow plays the Centas program\u2019s part, take steps collect\
  \ new sales documents, orders, purchases and payments from the Centas WS queue and\
  \ save them as workflow files. Each connection is one Centas WS project, reached\
  \ with its WS key."
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-centas/issues
  website_url: https://github.com/Flow-Steward/ext-finance-centas
listing:
  category: finance
  tags:
  - centas
  - accounting
  - lithuania
  - invoices
  - orders
  - payments
  - inventory
  summary: Send invoices, orders, payments, products and clients to Centas WS and
    read products, stock, documents and purchases.
  categories:
  - finance
  - inventory
  - sales
  setup_summary: "Get the API key of your Centas WS project from Centas WS (ws.centas.lt;\
    \ a company that already uses it has the same key in the Centas program as WS\
    \ raktas), add it to a project connection and run the connection test, which also\
    \ shows the key\u2019s expiry."
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_centas
  required_scopes:
