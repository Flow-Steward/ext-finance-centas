page_id: setup-guide
title: Setup Guide
description: How to connect a Centas WS project to Flow Steward — about two minutes to read.
components:
  - component_id: setup_centas
    type: markdown
    title: For the person who runs Centas
    body: |
      1. **Check Centas WS.** The steps use Centas WS (ws.centas.lt), the web exchange of the Centas program. Your company needs it active, and Centas set up to work with it.
      2. **Copy the WS key.** In Centas open **Parametrai → Nustatymai → Bendrieji → III**. The field **WS raktas** holds the key. Treat it like a password: anyone with it can send documents to your Centas WS.
      3. **Upload products and stock, if workflows read them.** The read steps see what Centas uploads to Centas WS:
         - stock: **Nustatymai → Bendrieji → VIII**, *Autom. el. pard. sandėlio atnaujinimas* → **Per Centas WS**;
         - product cards: in the product list, *Sąrašo eksportas* → **Prekių ir paslaugų sąrašas į WS**.
      4. **Import what workflows send.** Sent invoices, orders and payments wait in Centas WS. Import them in Centas through the **ws.centas.lt** menu (new sales and purchase invoices, orders, payments).

      [Centas: how to set up Centas for WS (PDF)](http://edlonta.info/files/centas_ws.pdf)
  - component_id: setup_flow_steward
    type: markdown
    title: For the person who connects in Flow Steward
    body: |
      1. Open **Connection** and add a connection. Name it after the company, for example `UAB X`.
      2. Paste the WS key.
      3. Save and press **Test connection**. It starts reading the product export to check the key.
      4. In a workflow, add a Centas step and pick this connection. Start with **Send a sales invoice to Centas** or **Get products** on **Centas API**.
