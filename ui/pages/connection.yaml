page_id: connection
title: Connection
description: Add and test the Centas WS project of a company.
components:
  - component_id: centas_connections
    type: connection_form
    title: Centas WS projects
    description: Add one connection per Centas WS project, then test it. The key is stored encrypted and never shown again.
    data:
      connection_kind: extension
      connection_type: centas
      config_fields: [label]
      secret_fields: [token]
      test_action: test_connection
    defaults:
      label: ''
    fields:
      - path: label
        widget: text
        label: Label
        placeholder: UAB X
      - path: token
        widget: secret
        label: WS key
        required: true
        help: The API key of your Centas WS project, issued by Centas WS (see Setup Guide).
    ui_schema:
      actions:
        test_label: Test connection
  - component_id: connection_credentials
    type: markdown
    title: Where the key comes from
    body: |
      1. The key is the API key of your Centas WS project: Centas WS issues it ([sign in](https://ws.centas.lt/interface/login) or [register](https://ws.centas.lt/interface/register)). If your company already works with Centas WS, the same key is in the Centas program: **Parametrai → Nustatymai → Bendrieji → III**, field **WS raktas** (see **Setup Guide**).
      2. Paste it above and press **Test connection**.

      The steps always connect to `https://ws.centas.lt`; there is no address to set.

      **If the test fails:**

      - **Authentication failed** — Centas WS does not accept the key: check it again, and that it has not expired.
      - **Connection failed** — ws.centas.lt could not be reached from Flow Steward; try again later.

      Test connection checks the key and returns until when it is valid, warning 30 days before it expires. It does not check the right to send documents.
