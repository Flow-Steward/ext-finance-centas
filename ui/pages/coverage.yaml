  type: markdown
  title: Coverage
  body: |+
    The steps cover the whole API Centas documents ([Centas API dokumentacija](https://centas.gitbook.io/docs)): 7 endpoints, each documented field either a step input or listed below with the reason it is not offered.

    - **POST /v1/documents/create** → Send a sales invoice to Centas
    - **POST /v1/orders/create** → Send a customer order to Centas
    - **POST /v1/products/import** → Send products to Centas
    - **GET /v1/products/export** → Get products, Find a product by code or barcode, Get stock levels, Test the connection
    - **POST /v1/payments/import** → Send bank payments to Centas
    - **GET /v1/payments/export** → Get payments, Send bank payments to Centas
    - **POST /v1/documents/purchase/import** → Send a purchase invoice to Centas

    ### Fields not offered

    - `isaf` of POST /v1/documents/create: Not offered: the documentation says it is used when the invoice is left out of the i.SAF registers but not which value to send.
    - `asmuo_status` of POST /v1/documents/create: Not offered: the documentation gives it no description.
    - `salis_kodas` of POST /v1/documents/create: Not offered: the documentation gives it no description.
    - `rows[].oper` of POST /v1/products/import: Always UPD, the only value the documentation shows.
    - `rows[].AnalogProducts` of POST /v1/products/import: Not offered: the documentation shows it only empty, without its content.
    - `rows[].RecommendedProducts` of POST /v1/products/import: Not offered: the documentation shows it only empty, without its content.

    The key (`token`) is the connection's WS raktas: in the body of every write and, as the API requires, in the query of the two exports.

