page_id: centas-api
title: Centas API
description: 'Every Centas step: what it does, which Centas WS call it makes, its inputs and results.'
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    Centas WS (ws.centas.lt) is the web exchange of the Centas program. The steps send sales invoices, purchase invoices, customer orders, bank payments and products to it, and read the products and payments the Centas program uploaded to it.

    - **Sent documents wait in Centas WS.** An accountant imports them in Centas (menu ws.centas.lt). A step's success means Centas WS received the document.
    - **Writes are sent once.** Flow Steward remembers every change it made, so a retried step does not send it twice, and test runs never send. When the outcome is unclear — a timeout, a lost connection, a refusal, an answer that cannot be read — the step is not retried: check Centas WS first.
    - **Totals are checked before sending.** A document whose totals do not match its lines stops with a conflict and nothing is sent.
    - **Reads return pages.** Centas WS sends each export whole; the steps filter it and return up to 500 rows a page.
- component_id: steps_sales
  type: markdown
  title: Sales
  body: |
    ### Send a sales invoice to Centas

    Sends a sales invoice with its lines to Centas WS and returns its document ID. Centas WS keeps what it receives until an accountant imports it in the Centas program (menu ws.centas.lt), so success means received by Centas WS, not yet booked. Not safe to run again by itself: Centas WS documents no duplicate check, so a rerun after an unclear outcome can send it twice — check Centas WS first.

    Action id `send_sales_invoice` · sends data to Centas WS · Centas WS: `POST /v1/documents/create`

    **Inputs**

    - `number` (text, optional): The invoice number (dok_num). Leave empty, or write auto, to have Centas number it from its free invoice forms; then give the transaction ID.
    - `transaction_id` (text, optional): Needed for an automatic number from Centas's invoice forms (trans_id).
    - `date` (date): The invoice date (data). YYYY-MM-DD.
    - `due_date` (date, optional): The payment term (apmok_iki). YYYY-MM-DD.
    - `buyer_name` (text): The buyer's name (pirkejas).
    - `buyer_code` (text, optional): The buyer's code in your systems (kl_kodas).
    - `buyer_company_code` (text, optional): The buyer's company or personal code (im_kodas).
    - `buyer_vat_code` (text, optional): The buyer's VAT code (pvm_kodas).
    - `buyer_email` (text, optional): The buyer's e-mail (email).
    - `buyer_address` (text, optional): The buyer's address (adresas).
    - `buyer_city` (text, optional): The buyer's city (miestas).
    - `buyer_country` (text, optional): The buyer's country (salis).
    - `buyer_eu_type` (one of local, eu, non_eu, optional): local (0), another EU country (1) or outside the EU (2) (estipas).
    - `buyer_group` (text, optional): The group a new buyer is put in (grupe).
    - `lines` (list of records): The invoice lines, 1 to 500: code, name, unit, quantity, price without VAT, vat_percent, vat_code, income_account, project.
    - `net_total` (decimal, optional): The total without VAT (bepvm_suma). Give the net total and the VAT total (and optionally the total) as on the document: they are checked against the lines within one cent per line and sent as given. Leave them empty to have them computed: each line's net amount rounded to cents, its VAT rounded to cents, summed.
    - `vat_total` (decimal, optional): The VAT amount (pvm_suma).
    - `total` (decimal, optional): The total with VAT; must be net total + VAT total.
    - `cost` (decimal, optional): The document's cost price (savikaina).
    - `vat_payable_account` (text, optional): The VAT payable account, digits (sask_moketpvm).
    - `receivable_account` (text, optional): The buyer debt account (sask_pirkskol).
    - `income_account` (text, optional): The income account, digits (sask_pajamos).
    - `project` (text, optional): The project or cost centre (projektas).
    - `order_number` (text, optional): The number of the order this invoice is for (uzsaknr).
    - `operation_description` (text, optional): An extra description of the operation (oper_apras).
    - `note` (text, optional): A note on the document (pastaba).
    - `issued_by` (text, optional): Who issued the invoice (israse_asmuo).
    - `issued_by_position` (text, optional): The issuer's position (israse_pareigos).
    - `intrastat_transport` (text, optional): Transport code for Intrastat (intrs_transprusis).
    - `intrastat_delivery_terms` (text, optional): Delivery terms code for Intrastat (intrs_pristsal).
    - `intrastat_transaction` (text, optional): Transaction code for Intrastat (intrs_sandoris).
    - `intrastat_county` (text, optional): County code for Intrastat (intrs_apskritis).
    - `intrastat_eu_country` (text, optional): EU country code for Intrastat (intrs_eusalis).

    **Results**

    - `document_id` (text): The document ID Centas WS returned.
    - `number` (text): The number sent (auto when Centas numbers it).
    - `net_total` (text): The net total sent.
    - `vat_total` (text): The VAT total sent.
    - `total` (text): The total sent.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Send a customer order to Centas

    Sends a customer order with its lines to Centas WS and returns its order hash. Centas WS keeps what it receives until an accountant imports it in the Centas program (menu ws.centas.lt), so success means received by Centas WS, not yet booked. Not safe to run again by itself: Centas WS documents no duplicate check, so a rerun after an unclear outcome can send it twice — check Centas WS first.

    Action id `send_order` · sends data to Centas WS · Centas WS: `POST /v1/orders/create`

    **Inputs**

    - `number` (text): The order number (uzsak_num).
    - `date` (date): The order date (uzsak_data). YYYY-MM-DD.
    - `customer_name` (text): The customer's name (uzsakovas).
    - `customer_company_code` (text, optional): The customer's company code (im_kodas).
    - `customer_vat_code` (text, optional): The customer's VAT code (pvm_kodas).
    - `customer_email` (text, optional): The customer's e-mail (email).
    - `customer_phone` (text, optional): The customer's phone (tel).
    - `customer_address` (text, optional): The customer's address (adresas).
    - `customer_city` (text, optional): The customer's city (miestas).
    - `postal_code` (text, optional): The postal code (pasto_kodas).
    - `customer_note` (text, optional): The customer's note (uzsakovas_pastaba).
    - `receivable_account` (text, optional): The customer debt account (pirk_skolsask).
    - `warehouse` (text, optional): The warehouse (sandelis).
    - `execution_date` (date, optional): When to carry it out (vykd_data). YYYY-MM-DD.
    - `delivery_date` (date, optional): The delivery date (pristat_data). YYYY-MM-DD.
    - `payment_date` (date, optional): The payment date (apmok_data). YYYY-MM-DD.
    - `arrival_date` (date, optional): The arrival date (atvyk_data). YYYY-MM-DD.
    - `departure_date` (date, optional): The departure date (isvyk_data). YYYY-MM-DD.
    - `lines` (list of records): The order lines, 1 to 500: code, supplier_code, name, unit, quantity, price without VAT, vat_percent.
    - `net_total` (decimal, optional): The order total without VAT (bepvm_suma). Give the net total and the VAT total (and optionally the total) as on the document: they are checked against the lines within one cent per line and sent as given. Leave them empty to have them computed: each line's net amount rounded to cents, its VAT rounded to cents, summed.
    - `vat_total` (decimal, optional): The order's VAT (pvm_suma).
    - `total` (decimal, optional): The order total with VAT; must be net total + VAT total (uzsak_suma).

    **Results**

    - `order_hash` (text): The order hash Centas WS returned.
    - `number` (text): The number sent (auto when Centas numbers it).
    - `net_total` (text): The net total sent.
    - `vat_total` (text): The VAT total sent.
    - `total` (text): The total sent.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_purchases
  type: markdown
  title: Purchases
  body: |
    ### Send a purchase invoice to Centas

    Sends a supplier's invoice with its lines to Centas WS and returns its purchase ID. Centas WS keeps what it receives until an accountant imports it in the Centas program (menu ws.centas.lt), so success means received by Centas WS, not yet booked. Not safe to run again by itself: Centas WS documents no duplicate check, so a rerun after an unclear outcome can send it twice — check Centas WS first.

    Action id `send_purchase_invoice` · sends data to Centas WS · Centas WS: `POST /v1/documents/purchase/import`

    **Inputs**

    - `seller_name` (text): The seller's name (kontrah).
    - `number` (text): The supplier's invoice number (dok_num).
    - `date` (date): The invoice date (data). YYYY-MM-DD.
    - `lines` (list of records): The invoice lines, 1 to 500: code, name, unit, quantity, price without VAT, vat_percent, vat_code, project.
    - `net_total` (decimal, optional): The total without VAT (bepvm_suma). Give the net total and the VAT total (and optionally the total) as on the document: they are checked against the lines within one cent per line and sent as given. Leave them empty to have them computed: each line's net amount rounded to cents, its VAT rounded to cents, summed.
    - `vat_total` (decimal, optional): The VAT amount (pvm_suma).
    - `total` (decimal, optional): The total with VAT; must be net total + VAT total.

    **Results**

    - `purchase_id` (text): The purchase ID Centas WS returned.
    - `number` (text): The number sent (auto when Centas numbers it).
    - `net_total` (text): The net total sent.
    - `vat_total` (text): The VAT total sent.
    - `total` (text): The total sent.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_payments
  type: markdown
  title: Payments
  body: |
    ### Send bank payments to Centas

    Sends bank payments to Centas WS in one batch and returns how many it created. Each payment needs its own reference (RefNr). Before sending, the step looks the references up in Centas WS's payment export and warns about any it already lists. Centas WS keeps what it receives until an accountant imports it in the Centas program (menu ws.centas.lt), so success means received by Centas WS, not yet booked. Not safe to run again by itself: Centas WS documents no duplicate check, so a rerun after an unclear outcome can send it twice — check Centas WS first.

    Action id `send_payments` · sends data to Centas WS · Centas WS: `POST /v1/payments/import`

    **Inputs**

    - `payments` (list of records): The payments, 1 to 500: type (for example BankDeb), date, amount, document_number, reference, details, payer_name, payer_code, account.

    **Results**

    - `sent` (whole number): How many payments were sent.
    - `found` (whole number): How many Centas WS found in them.
    - `created` (whole number): How many Centas WS created.
    - `references` (list): The references sent, in order.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get payments

    Reads the payments in Centas WS's payment export, optionally only a date range or one reference, one page at a time. The export is read whole and filtered here.

    Action id `get_payments` · reads only · Centas WS: `GET /v1/payments/export`

    **Inputs**

    - `date_from` (date, optional): Only payments on or after this date. YYYY-MM-DD.
    - `date_to` (date, optional): Only payments on or before this date. YYYY-MM-DD.
    - `reference` (text, optional): Only the payment with this reference.
    - `page` (whole number, optional): The page to read, from 1; pass next_page to continue.
    - `limit` (whole number, optional): Rows per page, 1 to 500. Default 100.

    **Results**

    - `items` (list of records): The payments of this page. Fields: `type`, `date`, `amount`, `document_number`, `reference`, `details`, `payer_name`, `payer_code`, `account`.
    - `count` (whole number): How many rows this page holds.
    - `total` (whole number): How many rows match in all.
    - `page` (whole number): This page's number.
    - `has_more` (yes/no): True when more rows follow.
    - `next_page` (whole number): The page to read next, or null.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_products
  type: markdown
  title: Products
  body: |
    ### Send products to Centas

    Sends product cards to Centas WS in one batch; Centas WS creates new ones and updates known ones and returns the counts. Only the fields given are sent. Not safe to run again by itself: Centas WS documents no duplicate check, so a rerun after an unclear outcome can send it twice — check Centas WS first.

    Action id `send_products` · sends data to Centas WS · Centas WS: `POST /v1/products/import`

    **Inputs**

    - `products` (list of records): The products, 1 to 500: code, id, name, unit, price, vat_percent, stock, group1-3, barcode, description, photo, stocks [{warehouse_id, warehouse_name, quantity}], parameters [{name, value}].

    **Results**

    - `sent` (whole number): How many products were sent.
    - `found` (whole number): How many Centas WS found in them.
    - `created` (whole number): How many Centas WS created.
    - `updated` (whole number): How many Centas WS updated.
    - `codes` (list): The product codes sent, in order.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get products

    Reads product cards, with stock by warehouse and parameters, one page at a time; or one product by its ID. The data is what the Centas program last uploaded to Centas WS (its product export), read whole and filtered here.

    Action id `get_products` · reads only · Centas WS: `GET /v1/products/export`

    **Inputs**

    - `id` (text, optional): Only this product (its ID in Centas WS).
    - `page` (whole number, optional): The page to read, from 1; pass next_page to continue.
    - `limit` (whole number, optional): Rows per page, 1 to 500. Default 100.

    **Results**

    - `items` (list of records): The products of this page. Fields: `id`, `code`, `name`, `unit`, `price`, `vat_percent`, `stock`, `group1`, `group2`, `group3`, `barcode`, `description`, `photo`, `stocks`, `parameters`.
    - `count` (whole number): How many rows this page holds.
    - `total` (whole number): How many rows match in all.
    - `page` (whole number): This page's number.
    - `has_more` (yes/no): True when more rows follow.
    - `next_page` (whole number): The page to read next, or null.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find a product by code or barcode

    Finds the one product with this code or barcode. Several products with it stop the step with a conflict. The data is what the Centas program last uploaded to Centas WS (its product export), read whole and filtered here.

    Action id `find_product` · reads only · Centas WS: `GET /v1/products/export`

    **Inputs**

    - `code` (text, optional): The product code, exactly.
    - `barcode` (text, optional): Or the barcode, exactly.

    **Results**

    - `found` (yes/no): True when the product exists.
    - `product` (record): The product, or null. Fields: `id`, `code`, `name`, `unit`, `price`, `vat_percent`, `stock`, `group1`, `group2`, `group3`, `barcode`, `description`, `photo`, `stocks`, `parameters`.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get stock levels

    Stock of products by warehouse, one row per product and warehouse, optionally for one product or one warehouse. The data is what the Centas program last uploaded to Centas WS (its product export), read whole and filtered here.

    Action id `get_stock_levels` · reads only · Centas WS: `GET /v1/products/export`

    **Inputs**

    - `code` (text, optional): Only this product code.
    - `warehouse_id` (text, optional): Only this warehouse.
    - `page` (whole number, optional): The page to read, from 1; pass next_page to continue.
    - `limit` (whole number, optional): Rows per page, 1 to 500. Default 100.

    **Results**

    - `items` (list of records): One row per product and warehouse. Fields: `code`, `name`, `unit`, `warehouse_id`, `warehouse_name`, `quantity`.
    - `count` (whole number): How many rows this page holds.
    - `total` (whole number): How many rows match in all.
    - `page` (whole number): This page's number.
    - `has_more` (yes/no): True when more rows follow.
    - `next_page` (whole number): The page to read next, or null.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_connection
  type: markdown
  title: Connection
  body: |
    ### Test the connection

    Checks the key by starting to read the product export; reads only its first few kilobytes.

    Action id `test_connection` · reads only · Centas WS: `GET /v1/products/export`

    **Inputs**

    - none

    **Results**

    - `connected` (yes/no): True when the key works.
    - `duration_ms` (whole number): How long the check took, in milliseconds.
    - `warnings` (list): What the step could not do fully or what to check.
