- operation_id: take_new_orders
  display_name: Take new orders from the Centas WS queue
  description: 'Reads the orders not yet marked as downloaded. Takes them from the Centas WS queue: Centas
    WS marks what it hands out, so the Centas program will no longer see these records as new. The answer
    is also saved whole as a workflow file.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_take_new_orders
  inputs:
  - *id003
  outputs:
  - name: items
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
        description: 'An order: uzsak_num, uzsak_data, uzsakovas, uzsak_suma, pvm_suma, bepvm_suma, eilute
          (rows).'
        properties:
          uzsak_num:
            description: Order number.
          uzsak_data:
            description: Order date.
          uzsakovas:
            description: Customer.
          uzsak_suma:
            description: Total.
          pvm_suma:
            description: VAT.
          bepvm_suma:
            description: Net total.
          eilute:
            type: array
            description: 'Rows: kodas, pavadinimas, matovnt, kiekis, kaina, pvmtar.'
      description: The records taken (empty when they do not fit the step output; then they are all in
        the file).
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many records were taken.
  - name: file
    value_type: artifact_handle
    schema:
      type: *id002
      description: Centas WS's answer, whole, as an XML workflow file.
  - *id004
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
