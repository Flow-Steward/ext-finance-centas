- operation_id: update_sales_documents
  display_name: Update sales documents' payment status
  description: Sets the downloaded mark, the paid mark or the remaining debt of sales documents named
    by type, number and date; fields not given stay unchanged.
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_update_sales_documents
  inputs:
  - *id003
  - name: documents
    value_type: array
    required: true
    schema:
      type: array
      title: Documents
      description: 'The documents, 1 to 500: type, number, date and at least one of downloaded, paid,
        remaining_debt.'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - type
        - number
        - date
        properties:
          type: &id007
            type: string
            maxLength: 20
            description: Document type, for example deb (type).
