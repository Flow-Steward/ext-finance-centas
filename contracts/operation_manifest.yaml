operations:
- operation_id: send_sales_invoice
  display_name: Send a sales invoice to Centas
  description: 'Sends a sales invoice with its lines and returns its document ID. Centas WS refuses a
    number it already has (a conflict, nothing saved). Centas WS keeps it until the Centas program imports
    it, so success means Centas WS received it. Centas WS does not check for repeats: sending the same
    invoice under the automatic number again can create it a second time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_send_sales_invoice
  inputs:
  - &id003
    name: connection_ref
    value_type: connection_ref
    required: true
  - name: number
    value_type: text
    required: true
    schema:
      type: string
      title: Invoice number
      description: The invoice number (dok_num), or auto for Centas's automatic numbering.
      maxLength: 50
  - name: date
    value_type: text
    required: true
    schema:
      type: string
      title: Date
      description: The invoice date (data). YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: due_date
    value_type: text
    required: true
    schema:
      type: string
      title: Due date
      description: The payment due date (apmok_iki). YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: buyer_name
    value_type: text
    required: true
    schema:
      type: string
      title: Buyer name
      description: The buyer's name (pirkejas).
      maxLength: 255
  - name: cost
    value_type: text
    required: true
    schema:
      type: &id001
      - number
      - string
      title: Cost
      description: The document's cost price total (savikaina).
  - name: lines
    value_type: array
    required: true
    schema:
      type: array
      title: Lines
      description: 'The invoice lines, 1 to 500: code, name, unit, quantity, price without VAT, vat_percent;
        optionally kind, ean, vat_code, income_account, project, vat_amount, discount_percent, discount,
        hs_code, country_origin, material.'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - code
        - name
        - unit
        - quantity
        - price
        - vat_percent
        properties:
          code: &id010
            type: string
