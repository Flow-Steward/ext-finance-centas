- operation_id: get_payments
  display_name: Get payments
  description: Reads the payments in Centas WS's payment export, optionally only a date range or one reference,
    one page at a time. The export is read whole and filtered here.
  operation_kind: source
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  inputs:
  - *id002
  - name: date_from
    value_type: text
    required: false
    schema:
      type: string
      title: From date
      description: Only payments on or after this date. YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: date_to
    value_type: text
    required: false
    schema:
      type: string
      title: To date
      description: Only payments on or before this date. YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: reference
    value_type: text
    required: false
    schema:
      type: string
      title: Reference
      description: Only the payment with this reference.
      maxLength: 100
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
      title: Page
      description: The page to read, from 1; pass next_page to continue.
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 500
      title: Rows
      description: Rows per page, 1 to 500. Default 100.
  outputs:
  - name: items
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - type
        - date
        - amount
        - document_number
        - reference
        - details
        - payer_name
        - payer_code
        - account
        properties:
          type:
            type: *id003
            description: Payment type, for example BankDeb.
          date:
            type: *id003
            description: Date, YYYY-MM-DD (as sent when it is not a date).
          amount:
            type: *id003
            description: Amount.
          document_number:
            type: *id003
            description: Document number.
          reference:
            type: *id003
            description: Unique reference.
          details:
            type: *id003
            description: Payment details.
          payer_name:
            type: *id003
            description: Payer or payee name.
          payer_code:
            type: *id003
            description: Payer or payee code.
          account:
            type: *id003
            description: Account number.
      description: The payments of this page.
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many rows this page holds.
  - name: total
    value_type: integer
    schema:
      type: integer
      description: How many rows match in all.
  - name: page
    value_type: integer
    schema:
      type: integer
      description: This page's number.
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
      description: True when more rows follow.
  - name: next_page
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: The page to read next, or null.
  - *id008
  result_fields:
  - result.items
  - result.count
  - result.total
  - result.page
  - result.has_more
  - result.next_page
  - result.warnings
