    name: connection_ref
    value_type: connection_ref
    required: true
  - name: number
    value_type: text
    required: false
    schema:
      type: string
      title: Invoice number
      description: The invoice number (dok_num). Leave empty, or write auto, to have Centas number it
        from its free invoice forms; then give the transaction ID.
      maxLength: 50
  - name: transaction_id
    value_type: text
    required: false
    schema:
      type: string
      title: Transaction ID
      description: Needed for an automatic number from Centas's invoice forms (trans_id).
      maxLength: 50
  - name: date
    value_type: text
    required: true
    schema:
