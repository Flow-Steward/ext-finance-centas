  display_name: Send a sales invoice to Centas
  description: 'Sends a sales invoice with its lines to Centas WS and returns its document ID. Centas
    WS keeps what it receives until an accountant imports it in the Centas program (menu ws.centas.lt),
    so success means received by Centas WS, not yet booked. Centas WS does not check for repeats: sending
    the same document again can create it a second time.'
