- operation_id: send_consignment
  display_name: Send a consignment note to Centas
  description: 'Sends a consignment note (waybill) with its lines. Centas WS does not check for repeats:
    sending the same consignment note again can create it a second time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_send_consignment
  inputs:
  - *id003
  - name: document_uid
    value_type: text
    required: true
    schema:
      type: string
      title: Document UID
      description: The consignment's unique ID (DocumentUID).
      maxLength: 100
  - name: document_number
    value_type: text
    required: true
    schema:
      type: string
      title: Document number
      description: The related document number (DocumentNumber).
      maxLength: 50
  - name: document_date
    value_type: text
    required: true
    schema:
      type: string
      title: Document date
      description: The document date (DocumentDate). YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: estimated_arrival
    value_type: text
    required: false
    schema:
      type: string
      title: Estimated arrival
      description: Estimated time of arrival (EstimatedTimeOfArrival). YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: consignee_name
    value_type: text
    required: true
    schema:
      type: string
      title: Consignee name
      description: The consignee (ConsigneeName).
      maxLength: 255
  - name: consignee_code
    value_type: text
    required: false
    schema:
      type: string
      title: Consignee code
      description: The consignee's registration number (ConsigneeRegistrationNumber).
      maxLength: 50
  - name: lines
    value_type: array
    required: true
    schema:
      type: array
      title: Lines
      description: '1 to 500: description, unit, quantity.'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - description
        - unit
        - quantity
        properties:
          description:
            type: string
            maxLength: 255
            description: Product description (ProductDescription).
          unit:
            type: string
            maxLength: 20
            description: Unit of measure (UnitOfMeasure).
          quantity:
            type: *id001
            description: Quantity (Quantity).
  outputs:
  - name: lines_sent
    value_type: integer
    schema:
      type: integer
      description: How many lines were sent.
  - name: consignment_rows_created
    value_type: integer
    schema:
      type: *id006
      description: How many rows Centas WS created.
  - *id004
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
