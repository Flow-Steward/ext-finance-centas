- operation_id: get_contrahents
  display_name: Get clients and suppliers
  description: Reads clients and suppliers with their branches; or one by its ID. The data is what the
    Centas program uploaded to Centas WS.
  operation_kind: source
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  inputs:
  - *id003
  - name: id
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 2147483647
      title: ID
      description: Only this client or supplier (its ID in Centas WS).
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
      title: Page
      description: The page to read, from 1; pass next_page to continue.
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 500
      title: Rows
      description: Rows per page, 1 to 500. Default 100.
  outputs:
  - name: items
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
        description: 'A client or supplier: id, pavadinimas, imones_kodas, pvm_kodas, salis, miestas,
          adresas, email, telefonas, iban_nr, pirkejas, tiekejas, skola, padaliniai (branches).'
        properties:
          id:
            description: ID.
          pavadinimas:
            description: Name.
          imones_kodas:
            description: Company code.
          pvm_kodas:
            description: VAT code.
          salis:
            description: Country.
          miestas:
            description: City.
          adresas:
            description: Address.
          email:
            description: E-mail.
          telefonas:
            description: Phone.
          iban_nr:
            description: IBAN.
          pirkejas:
            description: Buyer (1 or 0).
          tiekejas:
            description: Supplier (1 or 0).
          skola:
            description: Debt.
          padaliniai:
            type: array
            description: 'Branches: pavad, adresas, salis, miestas.'
      description: The clients and suppliers of this page.
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many rows this page holds.
  - name: total
    value_type: integer
    schema:
      type: integer
      description: How many rows Centas WS returned in all.
  - name: page
    value_type: integer
    schema:
      type: integer
      description: This page's number.
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
      description: True when more rows follow.
  - name: next_page
    value_type: integer
    schema:
      type: *id006
      description: The page to read next, or null.
  - *id004
  result_fields:
  - result.items
  - result.count
  - result.total
  - result.page
  - result.has_more
  - result.next_page
  - result.warnings
