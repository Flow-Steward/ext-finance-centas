- operation_id: send_payments
  display_name: Send bank and cash payments to Centas
  description: 'Sends payments in one batch and returns how many Centas WS created. Centas WS keeps it
    until the Centas program imports it, so success means Centas WS received it. Centas WS does not check
    for repeats: sending the same payment again can create it a second time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_send_payments
  inputs:
  - *id003
  - name: payments
    value_type: array
    required: true
    schema:
      type: array
      title: Payments
      description: 'The payments, 1 to 500: type (BankDeb, CashDeb, BankCred, CashDeb2), date, amount,
        document_number, details, payer_name; optionally reference, payer_code, receiver, account.'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - type
        - date
        - amount
        - document_number
        - details
        - payer_name
        properties:
          type:
            type: string
            enum:
            - BankDeb
            - CashDeb
            - BankCred
            - CashDeb2
            description: Payment type (PaymentType).
          date:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Date (Date). YYYY-MM-DD.
          amount:
            type: *id001
            description: Amount, greater than zero, 2 decimals (Amount).
          document_number:
            type: string
            maxLength: 50
            description: Document number (DocNr).
          details:
            type: string
            maxLength: 500
            description: Details (Details).
          payer_name:
            type: string
            maxLength: 255
            description: Payer or payee name (RecName).
          reference:
            type: string
            maxLength: 100
            description: Reference, unique in the batch (RefNr).
          payer_code:
            type: string
            maxLength: 50
            description: Payer or payee code (RecId).
          receiver:
            type: string
            maxLength: 255
            description: Receiver (Receiver).
          account:
            type: string
            maxLength: 50
            description: Account number (ToAccountNumber).
  outputs:
  - name: sent
    value_type: integer
    schema:
      type: integer
      description: How many payments were sent.
  - name: payments_found_xml
    value_type: integer
    schema:
      type: *id006
      description: How many Centas WS found.
  - name: payments_created
    value_type: integer
    schema:
      type: *id006
      description: How many it created.
  - *id004
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
