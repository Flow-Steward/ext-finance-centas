- operation_id: get_sales_documents
  display_name: Get sales documents by date or unpaid
  description: Reads sales documents of a date range, or all unpaid ones, with their rows. With these
    filters Centas WS ignores its downloaded mark, so nothing is taken from the queue.
  operation_kind: source
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  inputs:
  - *id003
  - name: date_from
    value_type: text
    required: false
    schema:
      type: string
      title: From date
      description: Only documents on or after this date. YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: date_to
    value_type: text
    required: false
    schema:
      type: string
      title: To date
      description: Only documents on or before this date. YYYY-MM-DD.
      maxLength: 10
      pattern: ^\d{4}-\d{2}-\d{2}$
  - name: unpaid
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Unpaid only
      description: Only unpaid documents (apmoketa = 0).
  - name: page
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
      title: Page
      description: The page to read, from 1; pass next_page to continue.
  - name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 500
      title: Rows
      description: Rows per page, 1 to 500. Default 100.
  outputs:
  - name: items
    value_type: array
    schema:
      type: array
      items: &id005
        type: object
        additionalProperties: true
        description: 'A sales document: type, dok_num, data, apmok_iki, pirkejas, dok_suma, pvm_suma,
          bepvm_suma, savikaina, im_kodas, pvm_kodas, apmoketa, dok_skola, eilute (rows).'
        properties:
          type:
            description: Document type.
          dok_num:
            description: Number.
          data:
            description: Date.
          apmok_iki:
            description: Due date.
          pirkejas:
            description: Buyer.
          dok_suma:
            description: Total.
          pvm_suma:
            description: VAT.
          bepvm_suma:
            description: Net total.
          savikaina:
            description: Cost.
          im_kodas:
            description: Buyer company code.
          pvm_kodas:
            description: Buyer VAT code.
          apmoketa:
            description: Paid (0 or 1).
          dok_skola:
            description: Remaining debt.
          eilute:
            type: array
            description: 'Rows: kodas, pavadinimas, matovnt, kiekis, kaina, pvmtar.'
      description: The documents of this page.
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many rows this page holds.
  - name: total
    value_type: integer
    schema:
      type: integer
      description: How many rows Centas WS returned in all.
  - name: page
    value_type: integer
    schema:
      type: integer
      description: This page's number.
  - name: has_more
    value_type: boolean
    schema:
      type: boolean
      description: True when more rows follow.
  - name: next_page
    value_type: integer
    schema:
      type: &id006
      - integer
