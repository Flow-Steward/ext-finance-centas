            description: Income account (sask_pajamos).
          project:
            type: string
            maxLength: 100
            description: Project (projektas).
          vat_amount:
            type: *id001
            description: The line's VAT amount, 2 decimals (pvmsuma).
          discount_percent:
            type: *id001
            description: Discount in percent (nuolaida_proc).
          discount:
