- operation_id: send_payments
  display_name: Send bank payments to Centas
  description: 'Sends bank payments to Centas WS in one batch and returns how many it created. Each payment
    needs its own reference (RefNr). Before sending, the step reads Centas WS''s payment export: when
    it already lists one of the references, or cannot be read, the step stops and sends nothing. Centas
    WS keeps what it receives until an accountant imports it in the Centas program (menu ws.centas.lt),
    so success means received by Centas WS, not yet booked. Centas WS does not check for repeats: sending
    the same document again can create it a second time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_send_payments
  inputs:
  - *id002
  - name: payments
    value_type: array
    required: true
    schema:
      type: array
      title: Payments
      description: 'The payments, 1 to 500: type (for example BankDeb), date, amount, document_number,
        reference, details, payer_name, payer_code, account.'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - type
        - date
        - amount
        - reference
        properties:
          type:
            type: string
            maxLength: 30
            description: Payment type code, for example BankDeb (PaymentType).
          date:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Date, YYYY-MM-DD (Date).
          amount:
            type: *id001
            description: Amount, greater than zero, 2 decimals (Amount).
          document_number:
            type: string
            maxLength: 50
            description: Document number (DocNr).
          reference:
            type: string
            maxLength: 100
            description: Unique reference of the payment (RefNr).
          details:
            type: string
            maxLength: 500
            description: Payment details (Details).
          payer_name:
            type: string
            maxLength: 255
            description: Payer or payee name (RecName).
          payer_code:
            type: string
            maxLength: 50
            description: Payer or payee code (RecId).
          account:
            type: string
            maxLength: 50
            description: Account number (ToAccountNumber).
  outputs:
  - name: sent
    value_type: integer
    schema:
      type: integer
      description: How many payments were sent.
  - name: found
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: How many Centas WS found in them.
  - name: created
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: How many Centas WS created.
  - name: references
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: The references sent, in order.
  - *id008
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.sent
  - result.found
  - result.created
  - result.references
