- operation_id: record_document_payments
  display_name: Record payments against sales documents
  description: 'Records payments against sales documents named by type, number and date, with the amount
    paid and the payments themselves. Centas WS does not check for repeats: sending the same payment again
    can create it a second time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_record_document_payments
  inputs:
  - *id003
  - name: documents
    value_type: array
    required: true
    schema:
      type: array
      title: Documents
      description: 'The documents, 1 to 500: type, number, date, paid_sum, paid_in_full, customer_id and
        payments [{date, number, description, total}].'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - type
        - number
        - date
        - paid_sum
        - payments
        properties:
          type: *id007
          number: *id008
          date: *id009
          paid_sum:
            type: *id001
            description: Amount paid (paid_sum).
          paid_in_full:
            type: boolean
            description: Paid in full (paid_full).
          customer_id:
            type: string
            maxLength: 50
            description: Customer ID (customerId).
          payments:
            type: array
            maxItems: 100
            description: The payments (payment).
            items:
              type: object
              additionalProperties: false
              required:
              - date
              - number
              - total
              properties:
                date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Payment date. YYYY-MM-DD.
                number:
                  type: string
                  maxLength: 50
                  description: Payment number.
                description:
                  type: string
                  maxLength: 500
                  description: Description.
                total:
                  type: *id001
                  description: Amount.
  outputs:
  - name: sent
    value_type: integer
    schema:
      type: integer
      description: How many documents were sent.
  - name: documents_payments_found_xml
    value_type: integer
    schema:
      type: *id006
      description: How many Centas WS found.
  - name: documents_payments_created
    value_type: integer
    schema:
      type: *id006
      description: How many payments it created.
  - *id004
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.sent
  - result.documents_payments_found_xml
  - result.documents_payments_created
  - result.warnings
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes:
  - invalid_payload
  - invalid_host_envelope
  - invalid_connection
  - unsupported_operation
  - internal_error
