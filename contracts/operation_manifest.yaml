- operation_id: send_contrahents
  display_name: Send clients and suppliers to Centas
  description: 'Sends clients and suppliers in one batch; Centas WS creates new ones and updates known
    ones. When branches are given, Centas WS may delete branches it has that are not among them (it reports
    how many). Centas WS does not check for repeats: sending the same client again can create it a second
    time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_send_contrahents
  inputs:
  - *id003
  - name: contrahents
    value_type: array
    required: true
    schema:
      type: array
      title: Clients and suppliers
      description: '1 to 500: name and any of id, company_code, vat_code, country, city, address, email,
        phone, iban, is_buyer, is_supplier, debt, telema_id, edisoft_iln, branches [{name, address, country,
        city}].'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - name
        properties:
          name:
            type: string
            maxLength: 255
            description: Name (pavadinimas).
          id:
            type: string
            maxLength: 20
            description: ID in Centas WS (id).
          company_code:
            type: string
            maxLength: 50
            description: Company code (imones_kodas).
          vat_code:
            type: string
            maxLength: 50
            description: VAT code (pvm_kodas).
          country:
            type: string
            maxLength: 100
            description: Country (salis).
          city:
            type: string
            maxLength: 100
            description: City (miestas).
          address:
            type: string
            maxLength: 255
            description: Address (adresas).
          email:
            type: string
            maxLength: 255
            description: E-mail (email).
          phone:
            type: string
            maxLength: 50
            description: Phone (telefonas).
          iban:
            type: string
            maxLength: 50
            description: IBAN (iban_nr).
          is_buyer:
            type: boolean
            description: A buyer (pirkejas).
          is_supplier:
            type: boolean
            description: A supplier (tiekejas).
          debt:
            type: *id001
            description: Debt (skola).
          telema_id:
            type: string
            maxLength: 50
            description: Telema ID (telema_id).
          edisoft_iln:
            type: string
            maxLength: 50
            description: Edisoft ILN (edisoft_iln).
          branches:
            type: array
            maxItems: 100
            description: Branches (padaliniai).
            items:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Name (pavad).
                address:
                  type: string
                  maxLength: 255
                  description: Address.
                country:
                  type: string
                  maxLength: 100
                  description: Country.
                city:
                  type: string
                  maxLength: 100
                  description: City.
  outputs:
  - name: sent
    value_type: integer
    schema:
      type: integer
      description: How many were sent.
  - name: contrahents_found_xml
    value_type: integer
    schema:
      type: *id006
      description: How many Centas WS found.
  - name: contrahents_created
    value_type: integer
    schema:
      type: *id006
      description: How many it created.
  - name: contrahents_updated
    value_type: integer
    schema:
      type: *id006
      description: How many it updated.
  - name: branches_created
    value_type: integer
    schema:
      type: *id006
      description: Branches created.
  - name: branches_updated
    value_type: integer
    schema:
      type: *id006
      description: Branches updated.
  - name: branches_deleted
    value_type: integer
    schema:
      type: *id006
      description: Branches deleted.
  - *id004
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.sent
  - result.contrahents_found_xml
  - result.contrahents_created
  - result.contrahents_updated
  - result.branches_created
  - result.branches_updated
  - result.branches_deleted
  - result.warnings
  - result.external_effect_status
  - result.definitely_no_external_effect
