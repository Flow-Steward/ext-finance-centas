            description: VAT rate in percent, 0 to 100 (pvmtar).
          kind:
            type: string
            maxLength: 5
            description: Product or service mark, for example P (prek_pasl).
          ean:
            type: string
            maxLength: 20
            description: EAN barcode (ean).
          vat_code:
            type: string
            maxLength: 20
            description: VAT classifier code, for example PVM1 (Mok_kodas).
          income_account:
            type: string
