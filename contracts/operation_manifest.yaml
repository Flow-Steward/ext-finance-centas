- operation_id: send_products
  display_name: Send products to Centas
  description: 'Sends product cards to Centas WS in one batch; Centas WS creates new ones and updates
    known ones and returns the counts. Only the fields given are sent. Centas WS does not check for repeats:
    sending the same product again can create it a second time.'
  operation_kind: action
  category: finance
  connection_type_ids:
  - centas
  workflow_visible: true
  effect_kind: centas_send_products
  inputs:
  - *id002
  - name: products
    value_type: array
    required: true
    schema:
      type: array
      title: Products
      description: 'The products, 1 to 500: code, id, name, unit, price, vat_percent, stock, group1-3,
        barcode, description, photo, stocks [{warehouse_id, warehouse_name, quantity}], parameters [{name,
        value}].'
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - code
        properties:
          code:
            type: string
            maxLength: 50
            description: Product code (kodas).
          id:
            type: string
            maxLength: 50
            description: Product ID in Centas WS (id).
          name:
            type: string
            maxLength: 255
            description: Name (pavadinimas).
          unit:
            type: string
            maxLength: 20
            description: Unit of measure (matovnt).
          price:
            type: *id001
            description: Price, up to 6 decimals (kaina).
          vat_percent:
            type: *id001
            description: VAT rate in percent (pvmtar).
          stock:
            type: *id001
            description: Stock in all (likutis).
          group1:
            type: string
            maxLength: 100
            description: Group 1 (grupe1).
          group2:
            type: string
            maxLength: 100
            description: Group 2 (grupe2).
          group3:
            type: string
            maxLength: 100
            description: Group 3 (grupe3).
          barcode:
            type: string
            maxLength: 50
            description: Barcode (barkodas).
          description:
            type: string
            maxLength: 2000
            description: Description (aprasymas).
          photo:
            type: string
            maxLength: 500
            description: Photo (Nuotrauka).
          stocks:
            type: array
            maxItems: 50
            description: Stock by warehouse (Stocks).
            items:
              type: object
              additionalProperties: false
              required:
              - warehouse_id
              - quantity
              properties:
                warehouse_id:
                  type: string
                  maxLength: 50
                  description: Warehouse ID (WarehouseId).
                warehouse_name:
                  type: string
                  maxLength: 255
                  description: Warehouse name (WarehouseName).
                quantity:
                  type: *id001
                  description: Quantity (Quantity).
          parameters:
            type: array
            maxItems: 100
            description: Parameters (ProductParameters).
            items:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Parameter name (Name).
                value:
                  type: string
                  maxLength: 1000
                  description: Parameter value (Value).
  outputs:
  - name: sent
    value_type: integer
    schema:
      type: integer
      description: How many products were sent.
  - name: found
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: How many Centas WS found in them.
  - name: created
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: How many Centas WS created.
  - name: updated
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: How many Centas WS updated.
  - name: codes
    value_type: array
    schema:
      type: array
      items:
        type: string
      description: The product codes sent, in order.
  - *id008
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.sent
  - result.found
  - result.created
  - result.updated
  - result.codes
  - result.warnings
  - result.external_effect_status
  - result.definitely_no_external_effect
